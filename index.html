<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node Shapes</title>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <h1>Node Shapes</h1>
    <div id="node-shapes-graph">
        <svg xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(20,20)">
                <rect x="0" y="0" rx="8" ry="8" width="100" height="40" fill="rgba(220,220,220,1)"></rect>
                <text x="8" y="24" font-family="Arial" font-size="16" fill="black" style="text-overflow: ellipsis; width: 50px; background-color: red;">Hello, some long text</text>
            </g>
        </svg>

        <svg id="svg" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(20,20)">
                <rect id="node-shapes-text-shape" x="0" y="0" rx="8" ry="8" width="200" height="40" fill="rgba(220,220,220,1)"/>
                <foreignObject id="node-shapes-text-foreign-object" x="0" y="0" width="200" height="40">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;box-sizing:border-box;padding:8px;display:flex;align-items:center;justify-content:center;">
                        <p id="node-shapes-text" style="
                            width:100%;
                            line-height:1.2em;
                            font-size:16px;
                            display:-webkit-box;
                            -webkit-box-orient:vertical;
                            overflow:hidden;
                            text-overflow:ellipsis;
                            word-break:break-word;
                            text-align:center;
                            color: rgba(0,0,0,1);
                        ">
                        Very long text that should wrap into multiple lines inside the rectangle. If it overflows vertically, it must be truncated with an ellipsis after the last visible line.
                        </p>
                    </div>
                </foreignObject>
            </g>
        </svg>

        
    </div>
</body>
<script type="module" src="/src/index.ts"></script>
</html>
